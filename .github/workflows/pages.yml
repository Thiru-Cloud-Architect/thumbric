name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    # Custom domain thumbric.app (Cloudflare → GitHub Pages).
    env:
      VITE_BASE_PATH: /
      VITE_SITE_URL: https://thumbric.app/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Keep VITE_API_BASE off tests — simpleAuth expects device-only without it.
      - run: npm test
      - run: npm run build
        env:
          # Cloudflare Worker (thumbric-api) holding FAL_KEY — public base URL only.
          VITE_API_BASE: https://thumbric-api.thirumalaikumarpappaiah.workers.dev
          VITE_BUILD_ID: ${{ github.sha }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
