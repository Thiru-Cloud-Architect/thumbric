name = "thumbric-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# After creating KV: wrangler kv namespace create THUMBRIC_USERS
# then paste the id below and uncomment.
# [[kv_namespaces]]
# binding = "THUMBRIC_USERS"
# id = "YOUR_KV_NAMESPACE_ID"

[vars]
# Optional: set ADMIN_TOKEN via `wrangler secret put ADMIN_TOKEN` for GET /api/users
# Premium AI: `npx wrangler secret put FAL_KEY` then set VITE_API_BASE on the site build.

# Optional Workers AI fallback (used when FAL_KEY is missing):
# [ai]
# binding = "AI"
